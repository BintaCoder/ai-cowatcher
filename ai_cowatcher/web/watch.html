<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Co-watcher</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #0f1115;
      --panel: #171a21;
      --border: #2a3140;
      --text: #e8ecf3;
      --muted: #9aa4b8;
      --accent: #5b8cff;
      --accent-pressed: #3f6fe0;
      --danger: #ff6b6b;
      --ok: #5bd18a;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
    }
    .layout {
      max-width: 1100px;
      margin: 0 auto;
      padding: 1.25rem;
      display: grid;
      gap: 1rem;
    }
    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
      flex-wrap: wrap;
    }
    h1 {
      margin: 0;
      font-size: 1.35rem;
      font-weight: 650;
    }
    .subtitle { color: var(--muted); font-size: 0.9rem; }
    .panel {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 1rem;
    }
    .controls {
      display: flex;
      gap: 0.75rem;
      align-items: center;
      flex-wrap: wrap;
    }
    label { color: var(--muted); font-size: 0.85rem; }
    select, button, input[type="text"] {
      font: inherit;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: #10141c;
      color: var(--text);
      padding: 0.55rem 0.85rem;
    }
    select { min-width: 220px; }
    #questionInput {
      flex: 1 1 220px;
      min-width: 180px;
    }
    button {
      cursor: pointer;
      transition: background 0.15s ease, transform 0.05s ease;
    }
    button:hover:not(:disabled) { background: #1a2130; }
    button:active:not(:disabled) { transform: translateY(1px); }
    button:disabled { opacity: 0.45; cursor: not-allowed; }
    #listenBadge {
      display: inline-flex;
      align-items: center;
      gap: 0.45rem;
      padding: 0.4rem 0.75rem;
      border-radius: 999px;
      border: 1px solid var(--border);
      color: var(--muted);
      font-size: 0.85rem;
      user-select: none;
    }
    #listenBadge.on {
      border-color: var(--accent);
      color: #cfe0ff;
      background: rgba(91, 140, 255, 0.12);
    }
    #listenBadge .dot {
      width: 0.55rem;
      height: 0.55rem;
      border-radius: 50%;
      background: var(--muted);
    }
    #listenBadge.on .dot {
      background: var(--ok);
      box-shadow: 0 0 0 3px rgba(91, 209, 138, 0.25);
    }
    video {
      width: 100%;
      max-height: 62vh;
      background: #000;
      border-radius: 12px;
      display: block;
    }
    .status {
      min-height: 1.25rem;
      color: var(--muted);
      font-size: 0.92rem;
    }
    .status.thinking { color: var(--accent); }
    .status.error { color: var(--danger); }
    .status.ok { color: var(--ok); }
    .transcript {
      display: grid;
      gap: 0.75rem;
    }
    .bubble {
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 0.75rem 0.9rem;
      background: #12161f;
    }
    .bubble h3 {
      margin: 0 0 0.35rem;
      font-size: 0.78rem;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      color: var(--muted);
    }
    .bubble p {
      margin: 0;
      line-height: 1.45;
      white-space: pre-wrap;
    }
    .hint {
      color: var(--muted);
      font-size: 0.85rem;
      line-height: 1.4;
    }
    .toolbar {
      display: flex;
      gap: 0.5rem;
      flex-wrap: wrap;
      margin-top: 0.75rem;
      align-items: center;
    }
    .nav-toggle {
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      color: var(--muted);
      font-size: 0.9rem;
      user-select: none;
    }
    @media (max-width: 720px) {
      .layout { padding: 0.75rem; }
      select { min-width: 100%; }
    }
  </style>
</head>
<body>
  <div class="layout">
    <header>
      <div>
        <h1>Co-watcher</h1>
        <div class="subtitle">Say <strong>Hey</strong> then your question — co-watcher answers briefly</div>
      </div>
      <div class="controls">
        <label for="titleSelect">Title</label>
        <select id="titleSelect" disabled>
          <option value="">Loading titles…</option>
        </select>
        <label for="personaSelect">Companion</label>
        <select id="personaSelect" title="Personality tone for answers">
          <option value="easygoing_friend">Easygoing Friend</option>
          <option value="witty_friend">Witty Friend</option>
          <option value="calm_scout">Calm Scout</option>
        </select>
        <label for="genderSelect">Voice</label>
        <select id="genderSelect" title="Preferred speech voice gender">
          <option value="female">Female</option>
          <option value="male">Male</option>
          <option value="neutral">Neutral</option>
        </select>
      </div>
    </header>

    <section class="panel">
      <video id="player" controls playsinline preload="metadata"></video>
      <div class="toolbar">
        <span id="listenBadge" class="" title="Mic awaits the wake word Hey, then your question">
          <span class="dot" aria-hidden="true"></span>
          <span id="listenBadgeText">Mic idle</span>
        </span>
        <label class="nav-toggle"><input id="navigationMode" type="checkbox" checked /> Navigate mode (jump to moments)</label>
        <label class="nav-toggle" title="VAD gain-duck program audio + TTS while you talk (never restarts the mic stream)">
          <input id="duckWhileTalking" type="checkbox" checked /> Duck volume while talking
        </label>
        <label
          class="nav-toggle"
          title="Hands-free wake word (Hey). Off by default for latency/quality tests."
        >
          <input id="autoListenMic" type="checkbox" /> Auto listen (wake word)
        </label>
        <button
          id="holdTalkBtn"
          type="button"
          title="Hold and speak — program volume ducks while held (no Hey needed)"
          style="cursor:pointer;border:1px solid #666;background:#222;color:inherit;padding:0.25rem 0.65rem;border-radius:4px;font:inherit;"
        >Hold to talk</button>
      </div>
      <div class="toolbar">
        <input id="questionInput" type="text" placeholder="Type · or Hold to talk · or Auto listen + Hey…" autocomplete="off" />
        <button id="sendBtn" type="button" disabled>Ask</button>
      </div>
      <p class="hint">
        Prefer <strong>Hold to talk</strong> for voice (press-and-hold; video ducks while you speak, no wake word).
        Or enable <em>Auto listen</em> and say <strong>Hey, who’s that?</strong>. Typing always works.
      </p>
      <div id="status" class="status">Pick a title to start.</div>
    </section>

    <section class="panel transcript">
      <div class="bubble">
        <h3>Your question</h3>
        <p id="questionText">—</p>
      </div>
      <div class="bubble">
        <h3>Co-watcher</h3>
        <p id="answerText">—</p>
      </div>
    </section>
  </div>


  <script src="/watch/conversation_ducking.js"></script>
  <script>
    const player = document.getElementById("player");
    const titleSelect = document.getElementById("titleSelect");
    const personaSelect = document.getElementById("personaSelect");
    const genderSelect = document.getElementById("genderSelect");
    const listenBadge = document.getElementById("listenBadge");
    const listenBadgeText = document.getElementById("listenBadgeText");
    const sendBtn = document.getElementById("sendBtn");
    const questionInput = document.getElementById("questionInput");
    const navigationMode = document.getElementById("navigationMode");
    const duckWhileTalking = document.getElementById("duckWhileTalking");
    const autoListenMic = document.getElementById("autoListenMic");
    const holdTalkBtn = document.getElementById("holdTalkBtn");
    const statusEl = document.getElementById("status");
    const questionText = document.getElementById("questionText");
    const answerText = document.getElementById("answerText");

    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
    const synth = window.speechSynthesis;

    const USER_ID = "web-viewer";
    const LS_PERSONA = "cowatcher.persona_id";
    const LS_GENDER = "cowatcher.companion_gender";
    /** Continuous auto-listen; default off for latency/quality tests. */
    const LS_AUTO_LISTEN = "cowatcher.auto_listen_mic";
    /** Persona TTS presets (rate / pitch) — mirrors server persona JSON. */
    const PERSONA_TTS = {
      witty_friend: { rate: 1.06, pitch: 1.05 },
      easygoing_friend: { rate: 0.98, pitch: 1.0 },
      calm_scout: { rate: 0.95, pitch: 0.95 },
    };

    function loadCompanionPrefs() {
      try {
        // Default false when key missing — no continuous ambient mic (isolation tests).
        if (autoListenMic) {
          const raw = localStorage.getItem(LS_AUTO_LISTEN);
          autoListenMic.checked = raw === "1" || raw === "true";
        }
        const p = localStorage.getItem(LS_PERSONA);
        if (p && personaSelect && [...personaSelect.options].some((o) => o.value === p)) {
          personaSelect.value = p;
        }
        const g = localStorage.getItem(LS_GENDER);
        if (g && genderSelect && [...genderSelect.options].some((o) => o.value === g)) {
          genderSelect.value = g;
        }
      } catch (_) { /* ignore */ }
    }

    function saveCompanionPrefs() {
      try {
        if (personaSelect) localStorage.setItem(LS_PERSONA, personaSelect.value);
        if (genderSelect) localStorage.setItem(LS_GENDER, genderSelect.value);
      } catch (_) { /* ignore */ }
    }

    function currentPersonaId() {
      return (personaSelect && personaSelect.value) || "easygoing_friend";
    }

    function currentCompanionGender() {
      return (genderSelect && genderSelect.value) || "female";
    }

    function pickVoiceForGender(gender) {
      if (!synth || typeof synth.getVoices !== "function") return null;
      const voices = synth.getVoices() || [];
      if (!voices.length) return null;
      const g = (gender || "neutral").toLowerCase();
      const score = (v) => {
        const name = `${v.name || ""} ${v.lang || ""}`.toLowerCase();
        let s = 0;
        if (v.lang && v.lang.toLowerCase().startsWith("en")) s += 3;
        if (g === "female") {
          if (/\b(female|woman|zira|samantha|karen|moira|tessa|fiona|victoria|google us english female)\b/.test(name)) s += 5;
          if (/\b(male|david|daniel|mark|alex|fred|rishi)\b/.test(name)) s -= 3;
        } else if (g === "male") {
          if (/\b(male|david|daniel|mark|alex|fred|rishi|google us english male)\b/.test(name)) s += 5;
          if (/\b(female|woman|zira|samantha|karen|moira|tessa|fiona|victoria)\b/.test(name)) s -= 3;
        } else {
          // neutral: prefer non-extreme names, still English first
          if (/\b(neural|natural|enhanced)\b/.test(name)) s += 1;
        }
        return s;
      };
      let best = voices[0];
      let bestScore = score(best);
      for (const v of voices) {
        const sc = score(v);
        if (sc > bestScore) {
          best = v;
          bestScore = sc;
        }
      }
      return best;
    }

    function applyUtteranceVoice(utterance) {
      const personaId = currentPersonaId();
      const gender = currentCompanionGender();
      const tts = PERSONA_TTS[personaId] || { rate: 1.0, pitch: 1.0 };
      utterance.rate = Math.min(1.4, Math.max(0.7, tts.rate || 1));
      utterance.pitch = Math.min(1.5, Math.max(0.5, tts.pitch || 1));
      const voice = pickVoiceForGender(gender);
      if (voice) utterance.voice = voice;
    }

    if (personaSelect) {
      personaSelect.addEventListener("change", saveCompanionPrefs);
    }
    if (genderSelect) {
      genderSelect.addEventListener("change", saveCompanionPrefs);
    }
    loadCompanionPrefs();
    // Chromium loads voices asynchronously
    if (synth && typeof synth.onvoiceschanged !== "undefined") {
      synth.onvoiceschanged = () => { /* warm voice list */ synth.getVoices(); };
    }
    /** Min gap between STT sessions — prevents Chromium speech-process thrash. */
    const LISTEN_COOLDOWN_MS = 1800;
    /** Rebuild SpeechRecognition periodically (handlers + internal buffers). */
    const RECREATE_AFTER_SESSIONS = 12;
    const MAX_STARTS_PER_MIN = 25;
    /** Conversation duck config (VAD + gain ramps) — from conversation_ducking.js. */
    const DUCK = (window.CowatcherDucking && window.CowatcherDucking.DUCK_CONFIG)
      ? window.CowatcherDucking.DUCK_CONFIG
      : {
          DUCK_GAIN: 0.15,
          AMBIENT_GAIN: 0.48,
          SPEECH_HANGOVER_MS: 500,
          RAMP_DOWN_S: 0.15,
          RAMP_UP_S: 0.3,
          VAD_RMS_THRESHOLD: 0.04,
          VAD_MIN_THRESHOLD: 0.028,
          VAD_THRESHOLD_MARGIN: 0.016,
          VAD_NOISE_ALPHA: 0.03,
          VAD_POLL_MS: 40,
          VOLUME_FALLBACK_MIN: 0.08,
        };
    /** After quieting program audio, re-open STT once gain has settled (does not restart mic stream). */
    const PROGRAM_BLEED_RESTART_MS = 480;
    /** Treat STT as "user" only after program was quieted (or show is not audible). */
    const USER_LISTEN_WINDOW_MS = 6000;
    /** Legacy rAF volume fade when Web Audio graph is not yet available. */
    const VOLUME_FADE_MS = 280;

    const NAV_INTENT_RE = /\b(go to|jump to|skip to|take me to|show me|find|where does|where is|when does|rewind|fast[\s-]?forward|seek)\b/i;
    const JOKE_INTENT_RE = /\b(tell me a joke|got a (?:good )?joke|make me laugh|say something funny|one[\s-]?liner|be funny|any jokes?|jokes?)\b/i;
    const GO_TO_TIME_RE = /\b(?:go|jump|skip|take me)\s+to\s+(\d{1,2}:\d{2}(?::\d{2})?|\d+(?:\.\d+)?\s*(?:hours?|hrs?|h|minutes?|mins?|m))\b/i;
    const CLOCK_RE = /\b(\d{1,2}):(\d{2})(?::(\d{2}))?\b/;
    const DURATION_RE = /(\d+(?:\.\d+)?)\s*(hours?|hrs?|h|minutes?|mins?|m|seconds?|secs?|s)\b/gi;
    const FILLER_ONLY_RE = /^(um+|uh+|uhm+|erm+|hmm+|mm+|mhm+|ah+|oh+|huh+|yeah|yep|ok|okay|so|like|well)\.?$/i;
    /** Wake word — only phrases with this become voice questions (typed path skips it). */
    const WAKE_WORD_RE = /\b(?:hey|hay)\b(?:\s+(?:co[- ]?watcher|cowatcher|there))?\b/i;

    /**
     * @returns {null | { wakeOnly: true } | { question: string }}
     * null = no wake word (ignore as program / noise)
     */
    function parseWakeUtterance(raw, opts) {
      const text = (raw || "").replace(/\s+/g, " ").trim();
      if (!text) return null;
      // Hold-to-talk: whole utterance is the question (no Hey required).
      if (opts && opts.pushToTalk) {
        return { question: text };
      }
      const match = text.match(WAKE_WORD_RE);
      if (!match) return null;
      const after = text.slice(match.index + match[0].length).replace(/^[\s,.\-–—:;!?]+/, "").trim();
      if (!after) return { wakeOnly: true };
      return { question: after };
    }

    function isNavigationQuestion(question) {
      if (JOKE_INTENT_RE.test(question)) return false;
      if (navigationMode && navigationMode.checked) {
        if (NAV_INTENT_RE.test(question)) return true;
        if (/\b(first|second|third|fourth|fifth|\d+(?:st|nd|rd|th))\s+(goal|fight|point|six|wicket|touchdown|scene|kiss|moment)\b/i.test(question)) return true;
        if (/\b(credits?|post[- ]credits?)\b/i.test(question)) return true;
        if (/\b\d{1,2}:\d{2}(?::\d{2})?\b/.test(question)) return true;
        if (/\b\d+(?:\.\d+)?\s*(?:minutes?|mins?|hours?|hrs?)\b/i.test(question)) return true;
        if (/\b(airplane|plane|crash)\b/i.test(question)) return true;
      }
      return NAV_INTENT_RE.test(question);
    }

    function isClientNoise(question) {
      const q = (question || "").trim();
      if (!q || q.length < 2) return true;
      if (FILLER_ONLY_RE.test(q)) return true;
      return false;
    }

    function parseClientSeekTimestamp(question) {
      if (!question) return null;
      const goMatch = question.match(GO_TO_TIME_RE);
      if (goMatch) {
        const fragment = goMatch[1];
        if (fragment.includes(":")) return parseClockFragment(fragment);
        const duration = parseDurationSeconds(question);
        if (duration != null) return duration;
      }
      const clock = parseClockFragment(question);
      if (clock != null) return clock;
      return parseDurationSeconds(question);
    }

    function parseClockFragment(text) {
      const match = text.match(CLOCK_RE);
      if (!match) return null;
      let hours = 0, minutes, seconds;
      if (match[3] != null) {
        hours = parseInt(match[1], 10);
        minutes = parseInt(match[2], 10);
        seconds = parseInt(match[3], 10);
      } else if (parseInt(match[1], 10) > 59) {
        hours = parseInt(match[1], 10);
        minutes = parseInt(match[2], 10);
        seconds = 0;
      } else {
        minutes = parseInt(match[1], 10);
        seconds = parseInt(match[2], 10);
      }
      return hours * 3600 + minutes * 60 + seconds;
    }

    function parseDurationSeconds(text) {
      let total = 0, found = false;
      DURATION_RE.lastIndex = 0;
      let match;
      while ((match = DURATION_RE.exec(text)) !== null) {
        found = true;
        const value = parseFloat(match[1]);
        const unit = match[2].toLowerCase();
        if (unit.startsWith("h")) total += value * 3600;
        else if (unit.startsWith("m")) total += value * 60;
        else total += value;
      }
      return found ? total : null;
    }

    function applySeek(seekToTs) {
      if (seekToTs == null || Number.isNaN(seekToTs)) return;
      player.currentTime = Math.max(0, seekToTs);
      player.play().catch(() => {});
    }

    let recognition = null;
    let listening = false;
    let listenDesired = false;
    let askInFlight = false;
    let ttsSpeaking = false;
    let capturedTs = 0;
    let sessionTranscript = "";
    let sessionConfidence = 0;
    /** Hold-to-talk: skip wake word; duck program while pressed. */
    let pushToTalkActive = false;
    let restartListenTimer = null;
    let thinkingTimer = null;
    let lastListenStartMs = 0;
    let sessionCount = 0;
    let startTimestamps = [];
    let activeStreamAbort = null;
    let activeSpeaker = null;

    // Conversation-aware ducking (VAD + continuous gain) ----------
    // Mic MediaStream + AudioContext are acquired once per watch session and never
    // stopped/recreated for ducking or TTS (only gain / SpeechSynthesis volume change).
    // Web Speech STT may still start/stop recognition sessions; that is separate from
    // the long-lived getUserMedia stream used by AnalyserNode VAD.
    // Browser SpeechRecognition cannot true AEC against HTML <video>; echoCancellation
    // on our persistent mic + program gain ramps reduce show-dialogue false triggers.
    let baseVolume = Math.min(1, Math.max(0.05, player.volume || 1));
    let duckReasons = new Set(); // "ambient" | "speech" | "ask" | "tts" | "ptt"
    let volumeFadeRaf = null;
    let speechUnduckTimer = null;
    let ignoringVolumeChange = false;
    /** After we quiet program audio, allow user STT for a short window. */
    let userListenUntilMs = 0;
    let quietingProgram = false;

    /**
     * Persistent audio session — created at most once.
     * { ctx, micStream, micSource, analyser, programGain, mediaElementSource, vadTimer, timeBuf }
     */
    let audioSession = null;
    let audioSessionPromise = null;
    let vadSpeechActive = false;
    let lastVadSpeechMs = 0;
    let noiseFloorRms = 0.012;
    /** Current TTS gain (SpeechSynthesisUtterance.volume; no Web Audio path for synth). */
    let ttsGainValue = 1;
    let activeUtterance = null;
    let lastAppliedProgramGain = 1;

    function duckEnabled() {
      return !duckWhileTalking || duckWhileTalking.checked;
    }

    function duckHelpers() {
      return window.CowatcherDucking || null;
    }

    function programIsAudible() {
      if (!player) return false;
      if (player.paused || player.ended || player.muted) return false;
      if ((player.volume || 0) <= 0.04) return false;
      if (audioSession && audioSession.programGain && lastAppliedProgramGain <= 0.04) {
        return false;
      }
      // readyState HAVE_CURRENT_DATA+
      return (player.readyState || 0) >= 2;
    }

    function userListenArmed() {
      return Date.now() < userListenUntilMs;
    }

    function armUserListenWindow(ms = USER_LISTEN_WINDOW_MS) {
      userListenUntilMs = Date.now() + ms;
    }

    function captureBaseVolume() {
      if (duckReasons.size > 0 || ignoringVolumeChange) return;
      // When Web Audio owns program level, player.volume is the user preference.
      const v = player.volume;
      if (typeof v === "number" && !Number.isNaN(v) && v >= 0) {
        baseVolume = Math.min(1, Math.max(0.05, v));
      }
    }

    function computeTargetGains() {
      const helpers = duckHelpers();
      if (helpers && typeof helpers.targetGains === "function") {
        return helpers.targetGains({
          enabled: duckEnabled(),
          reasons: duckReasons,
          vadSpeechActive,
          cfg: DUCK,
        });
      }
      // Inline fallback if helper script failed to load.
      if (!duckEnabled()) return { program: 1, tts: 1, rampSec: DUCK.RAMP_UP_S };
      const hard =
        duckReasons.has("ask")
        || duckReasons.has("tts")
        || duckReasons.has("speech")
        || duckReasons.has("ptt")
        || vadSpeechActive;
      if (hard) {
        return {
          program: DUCK.DUCK_GAIN,
          tts: DUCK.DUCK_GAIN,
          rampSec: DUCK.RAMP_DOWN_S,
        };
      }
      if (duckReasons.has("ambient")) {
        return {
          program: DUCK.AMBIENT_GAIN,
          tts: 1,
          rampSec: DUCK.RAMP_DOWN_S,
        };
      }
      return { program: 1, tts: 1, rampSec: DUCK.RAMP_UP_S };
    }

    function rampGainParam(gainParam, target, rampSec) {
      if (!audioSession || !gainParam) return;
      const now = audioSession.ctx.currentTime;
      const end = Math.min(1, Math.max(0, target));
      try {
        gainParam.cancelScheduledValues(now);
        gainParam.setValueAtTime(gainParam.value, now);
        gainParam.linearRampToValueAtTime(end, now + Math.max(0.02, rampSec || 0.1));
      } catch (_) {
        gainParam.value = end;
      }
      lastAppliedProgramGain = end;
    }

    /** Fallback: fade HTMLMediaElement.volume when Web Audio graph is not ready. */
    function fadePlayerVolume(target, durationMs = VOLUME_FADE_MS) {
      if (volumeFadeRaf) {
        cancelAnimationFrame(volumeFadeRaf);
        volumeFadeRaf = null;
      }
      const start = player.volume;
      const end = Math.min(1, Math.max(0, target));
      if (Math.abs(start - end) < 0.01) {
        ignoringVolumeChange = true;
        player.volume = end;
        ignoringVolumeChange = false;
        return;
      }
      const t0 = performance.now();
      function step(now) {
        const t = Math.min(1, (now - t0) / Math.max(durationMs, 1));
        const eased = 1 - (1 - t) * (1 - t);
        ignoringVolumeChange = true;
        player.volume = start + (end - start) * eased;
        ignoringVolumeChange = false;
        if (t < 1) {
          volumeFadeRaf = requestAnimationFrame(step);
        } else {
          volumeFadeRaf = null;
        }
      }
      volumeFadeRaf = requestAnimationFrame(step);
    }

    function applyTtsGain(target) {
      ttsGainValue = Math.min(1, Math.max(0, target));
      if (activeUtterance) {
        try {
          activeUtterance.volume = ttsGainValue;
        } catch (_) { /* browser may ignore mid-utterance volume */ }
      }
    }

    /**
     * Apply program + TTS duck targets. Prefer GainNode ramps; never restarts audio graph.
     */
    function applyUnifiedGains() {
      const { program, tts, rampSec } = computeTargetGains();
      if (audioSession && audioSession.programGain) {
        // Keep element volume as user base; duck via GainNode only.
        rampGainParam(audioSession.programGain.gain, program, rampSec);
      } else {
        // Pre-session fallback: same reason→fraction mapping on player.volume.
        if (program >= 0.99) {
          fadePlayerVolume(baseVolume);
        } else {
          const floor = DUCK.VOLUME_FALLBACK_MIN || 0.08;
          fadePlayerVolume(Math.max(floor, Math.min(baseVolume, baseVolume * program)));
        }
      }
      applyTtsGain(tts);
    }

    function syncDuckVolume() {
      if (speechUnduckTimer) {
        clearTimeout(speechUnduckTimer);
        speechUnduckTimer = null;
      }
      if (!duckEnabled()) {
        duckReasons.clear();
        vadSpeechActive = false;
        applyUnifiedGains();
        return;
      }
      applyUnifiedGains();
    }

    function setDuckReason(reason, active) {
      if (!duckEnabled() && active) return;
      if (active) {
        if (duckReasons.size === 0) captureBaseVolume();
        duckReasons.add(reason);
        syncDuckVolume();
        return;
      }
      duckReasons.delete(reason);
      // Mild delay unduck after speech so a brief pause mid-phrase doesn't pop volume up.
      if (reason === "speech" && duckReasons.size === 0 && !vadSpeechActive) {
        if (speechUnduckTimer) clearTimeout(speechUnduckTimer);
        speechUnduckTimer = setTimeout(() => {
          speechUnduckTimer = null;
          applyUnifiedGains();
        }, DUCK.SPEECH_HANGOVER_MS);
        return;
      }
      syncDuckVolume();
    }

    function processVadRms(rms) {
      const helpers = duckHelpers();
      if (!duckEnabled()) {
        if (vadSpeechActive) {
          vadSpeechActive = false;
          applyUnifiedGains();
        }
        return;
      }
      if (helpers && typeof helpers.updateNoiseFloor === "function") {
        noiseFloorRms = helpers.updateNoiseFloor(noiseFloorRms, rms, vadSpeechActive, DUCK);
      } else if (!vadSpeechActive) {
        const a = DUCK.VAD_NOISE_ALPHA;
        noiseFloorRms = noiseFloorRms * (1 - a) + rms * a;
      }
      const thr = helpers && typeof helpers.vadThreshold === "function"
        ? helpers.vadThreshold(noiseFloorRms, DUCK)
        : Math.max(
          DUCK.VAD_MIN_THRESHOLD,
          Math.max(DUCK.VAD_RMS_THRESHOLD, noiseFloorRms + DUCK.VAD_THRESHOLD_MARGIN)
        );
      const now = Date.now();
      if (rms >= thr) {
        lastVadSpeechMs = now;
        if (!vadSpeechActive) {
          vadSpeechActive = true;
          applyUnifiedGains();
        }
        return;
      }
      const elapsed = helpers && typeof helpers.hangoverElapsed === "function"
        ? helpers.hangoverElapsed(vadSpeechActive, lastVadSpeechMs, now, DUCK)
        : (vadSpeechActive && (now - lastVadSpeechMs) >= DUCK.SPEECH_HANGOVER_MS);
      if (elapsed) {
        vadSpeechActive = false;
        applyUnifiedGains();
      }
    }

    function startVadLoop() {
      if (!audioSession || audioSession.vadTimer) return;
      const analyser = audioSession.analyser;
      const buf = audioSession.timeBuf;
      const helpers = duckHelpers();
      audioSession.vadTimer = setInterval(() => {
        if (!audioSession || !analyser) return;
        try {
          analyser.getFloatTimeDomainData(buf);
        } catch (_) {
          return;
        }
        const rms = helpers && typeof helpers.computeRms === "function"
          ? helpers.computeRms(buf)
          : (() => {
              let sum = 0;
              for (let i = 0; i < buf.length; i += 1) sum += buf[i] * buf[i];
              return Math.sqrt(sum / buf.length);
            })();
        processVadRms(rms);
      }, DUCK.VAD_POLL_MS);
    }

    /**
     * Once-per-session: AudioContext + getUserMedia (+ media element graph).
     * Never recreates after success. Safe to call repeatedly.
     * getUserMedia only when ducking is enabled (VAD needed); graph without mic is not used.
     */
    async function ensureAudioSession() {
      if (!duckEnabled()) return audioSession;
      if (audioSession) {
        if (audioSession.ctx && audioSession.ctx.state === "suspended") {
          try { await audioSession.ctx.resume(); } catch (_) {}
        }
        return audioSession;
      }
      if (audioSessionPromise) return audioSessionPromise;

      audioSessionPromise = (async () => {
        const AC = window.AudioContext || window.webkitAudioContext;
        if (!AC || !navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
          return null;
        }
        let ctx;
        try {
          ctx = new AC();
        } catch (_) {
          return null;
        }
        let micStream;
        try {
          const constraints = (duckHelpers() && duckHelpers().MIC_CONSTRAINTS)
            || {
              audio: {
                echoCancellation: true,
                noiseSuppression: true,
                autoGainControl: true,
              },
              video: false,
            };
          micStream = await navigator.mediaDevices.getUserMedia(constraints);
        } catch (_) {
          // Soft-fail: keep volume fallbacks; do not leave a half-open session.
          try { await ctx.close(); } catch (_) {}
          return null;
        }

        let mediaElementSource;
        let programGain;
        try {
          mediaElementSource = ctx.createMediaElementSource(player);
          programGain = ctx.createGain();
          programGain.gain.value = 1;
          mediaElementSource.connect(programGain);
          programGain.connect(ctx.destination);
        } catch (_) {
          // createMediaElementSource can only be called once per element — treat as fatal graph fail.
          try {
            micStream.getTracks().forEach((t) => t.stop());
          } catch (_) {}
          try { await ctx.close(); } catch (_) {}
          return null;
        }

        const micSource = ctx.createMediaStreamSource(micStream);
        const analyser = ctx.createAnalyser();
        analyser.fftSize = 2048;
        analyser.smoothingTimeConstant = 0.75;
        // Analyse only — never connect mic to destination (would feedback).
        micSource.connect(analyser);

        // Restore user program level on the element; duck via programGain from now on.
        ignoringVolumeChange = true;
        player.volume = baseVolume;
        ignoringVolumeChange = false;

        audioSession = {
          ctx,
          micStream,
          micSource,
          analyser,
          programGain,
          mediaElementSource,
          vadTimer: null,
          timeBuf: new Float32Array(analyser.fftSize),
        };
        startVadLoop();
        applyUnifiedGains();
        return audioSession;
      })();

      try {
        const session = await audioSessionPromise;
        if (!session) {
          // Allow retry only when establishment failed (getUserMedia denied, etc.).
          audioSessionPromise = null;
        }
        return session;
      } catch (_) {
        audioSessionPromise = null;
        return null;
      }
    }

    /** Warm graph on user gesture (autoplay / mic policy). Idempotent. */
    function warmAudioSessionFromGesture() {
      void ensureAudioSession();
    }

    function shouldAmbientDuck() {
      return (
        duckEnabled()
        && listenDesired
        && Boolean(titleSelect.value)
        && !askInFlight
        && !ttsSpeaking
        && !document.hidden
        && programIsAudible()
      );
    }

    function syncAmbientDuck() {
      if (shouldAmbientDuck()) {
        setDuckReason("ambient", true);
      } else {
        setDuckReason("ambient", false);
      }
    }

    /**
     * Mic often hears speaker → treat as program bleed.
     * Quiet program via gain/VAD path and drop this STT round; next round is the viewer.
     * Does not stop the persistent MediaStream / AudioContext.
     */
    function suppressProgramBleedAndRelisten() {
      if (quietingProgram || askInFlight || ttsSpeaking) return;
      quietingProgram = true;
      sessionTranscript = "";
      sessionConfidence = 0;
      setDuckReason("speech", true);
      armUserListenWindow();
      updateListenBadge("on", "Quieting program…");
      setStatus("Program audio quieted — say your question now.", "ok");
      // Tear down STT only (not the VAD mic stream).
      if (recognition) {
        const rec = recognition;
        rec.onresult = null;
        rec.onspeechstart = null;
        rec.onspeechend = null;
        rec.onend = () => {
          listening = false;
          quietingProgram = false;
          scheduleListenRestart(PROGRAM_BLEED_RESTART_MS);
        };
        try { rec.abort(); } catch (_) {
          try { rec.stop(); } catch (_) {}
          quietingProgram = false;
          scheduleListenRestart(PROGRAM_BLEED_RESTART_MS);
        }
      } else {
        quietingProgram = false;
        scheduleListenRestart(PROGRAM_BLEED_RESTART_MS);
      }
    }

    player.addEventListener("volumechange", () => {
      if (ignoringVolumeChange) return;
      // With Web Audio graph, player.volume is always the user base.
      if (audioSession && duckReasons.size > 0) {
        // While ducked via GainNode, still accept user scrubbing volume as new base.
        const v = player.volume;
        if (typeof v === "number" && !Number.isNaN(v) && v >= 0) {
          baseVolume = Math.min(1, Math.max(0.05, v));
        }
        return;
      }
      if (duckReasons.size > 0) return;
      captureBaseVolume();
    });
    player.addEventListener("play", () => {
      warmAudioSessionFromGesture();
      syncAmbientDuck();
    });
    player.addEventListener("playing", () => syncAmbientDuck());
    player.addEventListener("pause", () => syncAmbientDuck());
    player.addEventListener("ended", () => syncAmbientDuck());
    player.addEventListener("volumechange", () => {
      if (!ignoringVolumeChange) syncAmbientDuck();
    });

    if (duckWhileTalking) {
      duckWhileTalking.addEventListener("change", () => {
        if (!duckWhileTalking.checked) {
          duckReasons.clear();
          vadSpeechActive = false;
          userListenUntilMs = 0;
          applyUnifiedGains();
        } else {
          warmAudioSessionFromGesture();
          syncAmbientDuck();
          applyUnifiedGains();
        }
      });
    }

    // Unlock AudioContext + optional mic for VAD on first intentional gesture.
    document.addEventListener("pointerdown", warmAudioSessionFromGesture, { passive: true });
    document.addEventListener("keydown", warmAudioSessionFromGesture, { passive: true });

    function setStatus(text, kind = "") {
      statusEl.textContent = text;
      statusEl.className = "status" + (kind ? " " + kind : "");
    }

    function updateListenBadge(state, label) {
      if (!listenBadge) return;
      listenBadge.classList.toggle("on", state === "on");
      listenBadgeText.textContent = label;
    }

    function startThinkingStatus(baseText) {
      const started = Date.now();
      setStatus(baseText, "thinking");
      if (thinkingTimer) clearInterval(thinkingTimer);
      thinkingTimer = setInterval(() => {
        const sec = ((Date.now() - started) / 1000).toFixed(1);
        setStatus(`${baseText} (${sec}s)`, "thinking");
      }, 500);
    }

    function stopThinkingStatus() {
      if (thinkingTimer) {
        clearInterval(thinkingTimer);
        thinkingTimer = null;
      }
    }

    function releaseControls() {
      askInFlight = false;
      sendBtn.disabled = !titleSelect.value;
      questionInput.disabled = !titleSelect.value;
      // Keep duck if TTS is about to/while speaking; otherwise restore.
      if (!ttsSpeaking) setDuckReason("ask", false);
      scheduleListenRestart(LISTEN_COOLDOWN_MS);
    }

    function speechSupported() { return Boolean(SpeechRecognition); }
    function ttsSupported() { return Boolean(synth); }

    function shouldBeListening() {
      return (
        listenDesired
        && speechSupported()
        && Boolean(titleSelect.value)
        && !askInFlight
        && !ttsSpeaking
        && !document.hidden
      );
    }

    function cancelSynth() {
      if (synth) {
        try { synth.cancel(); } catch (_) {}
      }
      activeUtterance = null;
      ttsSpeaking = false;
      setDuckReason("tts", false);
    }

    function disposeRecognition() {
      if (restartListenTimer) {
        clearTimeout(restartListenTimer);
        restartListenTimer = null;
      }
      if (!quietingProgram) setDuckReason("speech", false);
      if (!recognition) {
        listening = false;
        return;
      }
      const rec = recognition;
      recognition = null;
      listening = false;
      rec.onstart = null;
      rec.onspeechstart = null;
      rec.onspeechend = null;
      rec.onresult = null;
      rec.onerror = null;
      rec.onend = null;
      try { rec.abort(); } catch (_) {
        try { rec.stop(); } catch (_) {}
      }
    }

    function allowStartNow() {
      const now = Date.now();
      startTimestamps = startTimestamps.filter((t) => now - t < 60_000);
      if (startTimestamps.length >= MAX_STARTS_PER_MIN) return false;
      if (now - lastListenStartMs < LISTEN_COOLDOWN_MS) return false;
      return true;
    }

    function recordStart() {
      lastListenStartMs = Date.now();
      startTimestamps.push(lastListenStartMs);
      sessionCount += 1;
    }

    function scheduleListenRestart(delayMs = LISTEN_COOLDOWN_MS) {
      if (restartListenTimer) clearTimeout(restartListenTimer);
      restartListenTimer = setTimeout(() => {
        restartListenTimer = null;
        ensureListening();
      }, Math.max(delayMs, LISTEN_COOLDOWN_MS));
    }

    function wireRecognition(rec) {
      // One phrase per session — avoids continuous-mode Chromium memory growth.
      rec.continuous = false;
      rec.interimResults = true;
      rec.lang = "en-US";
      rec.maxAlternatives = 1;

      rec.onstart = () => {
        listening = true;
        sessionTranscript = "";
        sessionConfidence = 0;
        syncAmbientDuck();
        if (pushToTalkActive) {
          updateListenBadge("on", "Talk now…");
          setStatus("Hold-to-talk: speaking… release when done (volume ducked).", "ok");
        } else {
          updateListenBadge("on", "Say Hey…");
          if (!askInFlight && !ttsSpeaking) {
            setStatus('Listening for “Hey…”, then your question (e.g. Hey, who’s that?).', "ok");
          }
        }
      };

      rec.onspeechstart = () => {
        if (askInFlight || ttsSpeaking) return;
        updateListenBadge("on", pushToTalkActive ? "You're talking…" : "Say Hey…");
        // Reinforce duck while the user is mid-phrase (PTT already ducked on press).
        if (pushToTalkActive) setDuckReason("ptt", true);
      };

      rec.onspeechend = () => {
        if (!askInFlight && !ttsSpeaking && !duckReasons.has("speech") && !duckReasons.has("ptt")) {
          syncAmbientDuck();
        }
      };

      rec.onresult = (event) => {
        if (askInFlight || ttsSpeaking) return;
        let interim = "";
        for (let i = event.resultIndex; i < event.results.length; i += 1) {
          const result = event.results[i];
          const alt = result[0];
          const text = (alt.transcript || "").trim();
          if (!text) continue;
          if (result.isFinal) {
            sessionTranscript = `${sessionTranscript} ${text}`.trim();
            if (typeof alt.confidence === "number" && alt.confidence > 0) {
              sessionConfidence = Math.max(sessionConfidence, alt.confidence);
            }
          } else {
            interim = `${interim} ${text}`.trim();
          }
        }
        const preview = (sessionTranscript || interim || "").trim();
        const parsed = parseWakeUtterance(preview, { pushToTalk: pushToTalkActive });
        if (!parsed) {
          updateListenBadge("on", pushToTalkActive ? "Talk now…" : "Say Hey…");
          return;
        }
        if (!pushToTalkActive) setDuckReason("speech", true);
        else setDuckReason("ptt", true);
        if (parsed.wakeOnly) {
          questionText.textContent = "Hey…";
          updateListenBadge("on", "Heard Hey…");
          setStatus("Hey heard — add your question (Hey, what just happened?).", "ok");
          return;
        }
        questionText.textContent = parsed.question;
        updateListenBadge("on", "You're talking…");
      };

      rec.onerror = (event) => {
        listening = false;
        if (quietingProgram) {
          if (event.error === "aborted" || event.error === "no-speech") return;
          quietingProgram = false;
        }
        if (!pushToTalkActive) setDuckReason("speech", false);
        syncAmbientDuck();
        if (event.error === "no-speech" || event.error === "aborted") {
          if (!pushToTalkActive) scheduleListenRestart(LISTEN_COOLDOWN_MS);
          return;
        }
        if (event.error === "not-allowed") {
          listenDesired = false;
          pushToTalkActive = false;
          setDuckReason("ptt", false);
          updateListenBadge("off", "Mic blocked");
          setStatus("Microphone blocked — allow mic for this site, or type questions.", "error");
          return;
        }
        setStatus(`Speech error: ${event.error}`, "error");
        if (!pushToTalkActive) scheduleListenRestart(LISTEN_COOLDOWN_MS * 2);
      };

      rec.onend = () => {
        listening = false;
        if (quietingProgram) {
          quietingProgram = false;
          sessionTranscript = "";
          sessionConfidence = 0;
          scheduleListenRestart(PROGRAM_BLEED_RESTART_MS);
          return;
        }
        const raw = sessionTranscript.trim();
        const conf = sessionConfidence;
        sessionTranscript = "";
        sessionConfidence = 0;
        const wasPtt = pushToTalkActive;
        if (wasPtt) {
          pushToTalkActive = false;
          if (holdTalkBtn) holdTalkBtn.textContent = "Hold to talk";
        }

        const parsed = parseWakeUtterance(raw, { pushToTalk: wasPtt });
        if (!parsed) {
          setDuckReason("speech", false);
          if (wasPtt) setDuckReason("ptt", false);
          syncAmbientDuck();
          if (shouldBeListening()) scheduleListenRestart(LISTEN_COOLDOWN_MS);
          else updateListenBadge("off", "Mic idle");
          return;
        }
        if (parsed.wakeOnly) {
          setDuckReason("speech", false);
          syncAmbientDuck();
          setStatus('Say more after Hey — e.g. “Hey, who’s that?”', "ok");
          if (shouldBeListening()) scheduleListenRestart(LISTEN_COOLDOWN_MS);
          return;
        }

        if (!askInFlight && !ttsSpeaking) {
          // Keep program ducked into the ask (ptt → ask).
          setDuckReason("ask", true);
          setDuckReason("speech", false);
          setDuckReason("ptt", false);
          void handleHeardSpeech(parsed.question, conf);
          return;
        }
        setDuckReason("speech", false);
        setDuckReason("ptt", false);
        syncAmbientDuck();
        if (shouldBeListening()) {
          scheduleListenRestart(LISTEN_COOLDOWN_MS);
        } else if (ttsSpeaking) {
          updateListenBadge("off", "Speaking…");
        } else if (askInFlight) {
          updateListenBadge("off", "Thinking…");
        } else {
          updateListenBadge("off", "Mic idle");
        }
      };
    }

    function ensureRecognition() {
      if (recognition && sessionCount > 0 && sessionCount % RECREATE_AFTER_SESSIONS === 0) {
        disposeRecognition();
        sessionCount = 0;
      }
      if (!recognition && SpeechRecognition) {
        recognition = new SpeechRecognition();
        wireRecognition(recognition);
      }
      return recognition;
    }

    function setVadMicMuted(muted) {
      if (!audioSession || !audioSession.micStream) return;
      try {
        audioSession.micStream.getAudioTracks().forEach((t) => {
          t.enabled = !muted;
        });
      } catch (_) { /* */ }
    }

    function ensureListening() {
      const allowPtt = pushToTalkActive && !askInFlight && !ttsSpeaking && !document.hidden;
      if (!shouldBeListening() && !allowPtt) {
        if (!titleSelect.value) updateListenBadge("off", "Mic idle");
        else if (askInFlight) updateListenBadge("off", "Thinking…");
        else if (ttsSpeaking) updateListenBadge("off", "Speaking…");
        else if (document.hidden) updateListenBadge("off", "Tab hidden");
        else if (!listenDesired) updateListenBadge("off", "Mic off");
        else if (!speechSupported()) updateListenBadge("off", "Mic unavailable");
        return;
      }
      if (listening) {
        updateListenBadge("on", pushToTalkActive ? "Talk now…" : "Say Hey…");
        return;
      }
      if (!allowStartNow() && !pushToTalkActive) {
        scheduleListenRestart(LISTEN_COOLDOWN_MS);
        updateListenBadge("on", "Say Hey… (cool-down)");
        return;
      }
      const rec = ensureRecognition();
      if (!rec) return;
      try {
        recordStart();
        rec.start();
      } catch (err) {
        if (pushToTalkActive || shouldBeListening()) {
          scheduleListenRestart(200);
        }
      }
    }

    /**
     * Hold-to-talk: duck program volume immediately, then capture speech (no Hey).
     */
    function startPushToTalk() {
      if (!speechSupported()) {
        setStatus("Voice unavailable — type questions (Chrome works best).", "error");
        return;
      }
      if (!titleSelect.value) {
        setStatus("Pick a title first.", "error");
        return;
      }
      if (askInFlight || ttsSpeaking) return;

      pushToTalkActive = true;
      if (holdTalkBtn) holdTalkBtn.textContent = "Listening…";

      // Warm graph + duck *before* speech starts (AirPods-style conversation feel).
      void ensureAudioSession().then(() => {
        setVadMicMuted(true); // free hardware mic for SpeechRecognition
        setDuckReason("ptt", true);
      });
      setDuckReason("ptt", true);

      disposeRecognition();
      recognition = null;
      sessionCount = 0;
      lastListenStartMs = 0;
      ensureListening();
    }

    function stopPushToTalk() {
      if (!pushToTalkActive && !listening) return;
      if (recognition && listening) {
        try { recognition.stop(); } catch (_) {
          try { recognition.abort(); } catch (_2) {}
        }
      } else {
        pushToTalkActive = false;
        setDuckReason("ptt", false);
        if (holdTalkBtn) holdTalkBtn.textContent = "Hold to talk";
        setVadMicMuted(false);
      }
    }

    async function handleHeardSpeech(question, conf) {
      if (conf > 0 && conf < 0.25) {
        questionText.textContent = question;
        setStatus("Heard unclear speech — still listening next round.", "ok");
        setDuckReason("ask", false);
        setDuckReason("speech", false);
        setDuckReason("ptt", false);
        scheduleListenRestart(LISTEN_COOLDOWN_MS);
        return;
      }
      if (isClientNoise(question)) {
        setStatus("Listening… (ignored filler)", "ok");
        setDuckReason("ask", false);
        setDuckReason("speech", false);
        setDuckReason("ptt", false);
        scheduleListenRestart(LISTEN_COOLDOWN_MS);
        return;
      }
      capturedTs = player.currentTime || 0;
      await submitQuestion(question);
    }

    function setTtsSpeaking(active) {
      ttsSpeaking = active;
      if (active) {
        // Pause STT only — keep VAD mic + AudioContext warm (no stream restart).
        disposeRecognition();
        setDuckReason("tts", true);
        setDuckReason("ask", false);
        updateListenBadge("off", "Speaking…");
      } else {
        setDuckReason("tts", false);
        if (shouldBeListening()) {
          scheduleListenRestart(LISTEN_COOLDOWN_MS);
        }
      }
    }

    /** One utterance only — no progressive sentence queue (that leaked memory). */
    function speakOnce(text, readyMessage) {
      cancelSynth();
      if (!text || !ttsSupported()) {
        setStatus(readyMessage, "ok");
        scheduleListenRestart(LISTEN_COOLDOWN_MS);
        return;
      }
      // Cap spoken length so speech engine doesn't hold huge strings.
      const words = text.trim().split(/\s+/);
      const spoken = words.length > 40 ? `${words.slice(0, 40).join(" ")}…` : text.trim();

      setTtsSpeaking(true);
      setStatus("Answering…", "ok");
      const utterance = new SpeechSynthesisUtterance(spoken);
      applyUtteranceVoice(utterance);
      // TTS path uses SpeechSynthesisUtterance.volume (no Web Audio node for synth).
      // VAD may lower volume while user talks over the answer — does not cancel speech.
      utterance.volume = Math.max(0, Math.min(1, ttsGainValue));
      activeUtterance = utterance;
      const finish = () => {
        if (activeUtterance === utterance) activeUtterance = null;
        setTtsSpeaking(false);
        if (!askInFlight) setStatus(readyMessage, "ok");
      };
      utterance.onend = finish;
      utterance.onerror = finish;
      try {
        synth.speak(utterance);
      } catch (_) {
        finish();
      }
    }

    async function streamAsk(titleId, question) {
      if (activeStreamAbort) {
        try { activeStreamAbort.abort(); } catch (_) {}
      }
      activeStreamAbort = new AbortController();
      if (activeSpeaker) {
        try { activeSpeaker.cancel(); } catch (_) {}
        activeSpeaker = null;
      }
      cancelSynth();

      const response = await fetch("/ask/stream", {
        method: "POST",
        headers: { "Content-Type": "application/json", Accept: "text/event-stream" },
        body: JSON.stringify({
          title_id: titleId,
          current_ts: capturedTs,
          question,
          user_id: USER_ID,
          persona_id: currentPersonaId(),
          companion_gender: currentCompanionGender(),
        }),
        signal: activeStreamAbort.signal,
      });
      if (!response.ok) {
        let detail = "Ask stream failed";
        try { const errBody = await response.json(); detail = errBody.detail || detail; } catch (_) {}
        throw new Error(detail);
      }
      if (!response.body) throw new Error("Streaming not supported by browser");

      const reader = response.body.getReader();
      const decoder = new TextDecoder();
      let buffer = "";
      let answer = "";
      let donePayload = null;
      const readyMsg = 'Listening for “Hey…”, then your question.';
      answerText.textContent = "";
      let unlocked = false;

      const unlockOnce = () => {
        if (unlocked) return;
        unlocked = true;
        releaseControls();
      };

      try {
        while (true) {
          const { value, done } = await reader.read();
          if (done) break;
          buffer += decoder.decode(value, { stream: true });
          // Cap stuck buffer growth if client lags.
          if (buffer.length > 250_000) buffer = buffer.slice(-100_000);
          const chunks = buffer.split("\n\n");
          buffer = chunks.pop() || "";
          for (const chunk of chunks) {
            const line = chunk.split("\n").find((l) => l.startsWith("data: "));
            if (!line) continue;
            let event;
            try { event = JSON.parse(line.slice(6)); } catch (_) { continue; }
            if (event.type === "status" && event.message) startThinkingStatus(event.message);
            else if (event.type === "tool_start" && event.message) startThinkingStatus(event.message);
            else if (event.type === "token" && event.text) {
              stopThinkingStatus();
              answer += event.text;
              // Cap DOM answer growth for safety.
              if (answer.length > 4000) answer = answer.slice(0, 4000) + "…";
              answerText.textContent = answer;
              unlockOnce();
            } else if (event.type === "intent" && event.intent) {
              if (event.intent === "FILLER") startThinkingStatus("Skipping noise…");
              else if (event.intent === "NAVIGATE") startThinkingStatus("Jump requested…");
              else if (event.intent === "SOCIAL") startThinkingStatus("Quick chat…");
              else if (event.intent === "JOKE") startThinkingStatus("Cooking a one-liner…");
            } else if (event.type === "done") {
              stopThinkingStatus();
              answer = event.answer != null ? event.answer : answer;
              donePayload = event;
              const shouldSpeak = event.speak !== false && Boolean((answer || "").trim());
              if (!(answer || "").trim()) {
                answerText.textContent = "—";
                const reason = String(event.escalation_reason || event.intent || "");
                setStatus(
                  reason.includes("FILLER") || reason.includes("gate:ignore")
                    ? "Skipped unclear speech — still listening."
                    : event.navigate || reason.includes("NAVIGATE")
                      ? "Handing off navigate…"
                      : "No answer — still listening.",
                  "ok"
                );
              } else {
                answerText.textContent = answer;
              }
              unlockOnce();
              if (shouldSpeak) speakOnce(answer, readyMsg);
              else setStatus(readyMsg, "ok");
            } else if (event.type === "error") {
              throw new Error(event.detail || event.message || "Ask failed");
            }
          }
        }
      } finally {
        try { reader.releaseLock(); } catch (_) {}
        activeStreamAbort = null;
        buffer = "";
      }
      if (!donePayload) throw new Error("Stream ended without a response");
      unlockOnce();
      return { answer, done: donePayload };
    }

    async function runNavigate(titleId, question) {
      const response = await fetch("/navigate", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          title_id: titleId,
          current_ts: capturedTs,
          question,
          user_id: USER_ID,
        }),
      });
      const data = await response.json();
      if (!response.ok) throw new Error(data.detail || "Navigate request failed");
      stopThinkingStatus();
      answerText.textContent = data.answer || "—";
      if (data.seek_to_ts != null) {
        applySeek(data.seek_to_ts);
        releaseControls();
        setStatus(`Jumped to ${_formatTs(data.seek_to_ts)}`, "ok");
        speakOnce(data.answer, 'Listening for “Hey…”, then your question.');
        return;
      }
      releaseControls();
      speakOnce(data.answer, 'Listening for “Hey…”, then your question.');
    }

    async function submitQuestion(question) {
      const titleId = titleSelect.value;
      if (!titleId || askInFlight) return;
      void ensureAudioSession();
      if (isClientNoise(question)) {
        questionText.textContent = question || "—";
        answerText.textContent = "—";
        setStatus("Listening… (ignored filler)", "ok");
        setDuckReason("ask", false);
        setDuckReason("speech", false);
        scheduleListenRestart(LISTEN_COOLDOWN_MS);
        return;
      }

      const navigate = isNavigationQuestion(question);
      askInFlight = true;
      setDuckReason("ask", true);
      setDuckReason("speech", false);
      disposeRecognition();
      updateListenBadge("off", "Thinking…");
      sendBtn.disabled = true;
      questionInput.disabled = true;
      questionText.textContent = question;
      answerText.textContent = "…";

      const clientSeek = navigate ? parseClientSeekTimestamp(question) : null;
      if (clientSeek != null) {
        applySeek(clientSeek);
        answerText.textContent = `Jumping to ${_formatTs(clientSeek)}…`;
        startThinkingStatus(`Jumping to ${_formatTs(clientSeek)}`);
      } else {
        startThinkingStatus(navigate ? "Finding that moment…" : "Thinking…");
      }

      try {
        if (navigate) {
          await runNavigate(titleId, question);
          return;
        }

        const result = await streamAsk(titleId, question);
        // Merged-tag path may discover navigate intent server-side.
        if (result.done && (result.done.navigate || result.done.intent === "NAVIGATE")) {
          await runNavigate(titleId, question);
        } else {
          releaseControls();
        }
      } catch (err) {
        stopThinkingStatus();
        answerText.textContent = "—";
        setDuckReason("ask", false);
        setDuckReason("tts", false);
        if (err && err.name === "AbortError") {
          setStatus("Request cancelled.", "ok");
        } else {
          setStatus(err.message || "Something went wrong.", "error");
        }
        releaseControls();
      }
    }

    function submitTypedQuestion() {
      const question = (questionInput.value || "").trim();
      if (!question || askInFlight) return;
      capturedTs = player.currentTime || 0;
      questionInput.value = "";
      void submitQuestion(question);
    }

    function _formatTs(seconds) {
      const total = Math.floor(seconds);
      const hours = Math.floor(total / 3600);
      const minutes = Math.floor((total % 3600) / 60);
      const secs = total % 60;
      if (hours > 0) return `${hours}:${String(minutes).padStart(2, "0")}:${String(secs).padStart(2, "0")}`;
      return `${minutes}:${String(secs).padStart(2, "0")}`;
    }

    function autoListenEnabled() {
      return Boolean(autoListenMic && autoListenMic.checked);
    }

    function persistAutoListenPref() {
      try {
        localStorage.setItem(LS_AUTO_LISTEN, autoListenEnabled() ? "1" : "0");
      } catch (_) {}
    }

    function enableAmbientMic() {
      if (!autoListenEnabled()) {
        disableAmbientMic();
        updateListenBadge("off", "Mic off");
        return;
      }
      if (!speechSupported()) {
        listenDesired = false;
        updateListenBadge("off", "Mic unavailable");
        setStatus("Voice unavailable — type questions (Chrome works best).", "ok");
        return;
      }
      listenDesired = true;
      // Long-lived mic + VAD for conversation ducking (does not wait for STT).
      void ensureAudioSession();
      syncAmbientDuck();
      ensureListening();
    }

    function disableAmbientMic() {
      listenDesired = false;
      sessionTranscript = "";
      userListenUntilMs = 0;
      quietingProgram = false;
      disposeRecognition();
      setDuckReason("ambient", false);
      setDuckReason("speech", false);
      updateListenBadge("off", autoListenEnabled() ? "Mic idle" : "Mic off");
    }

    function applyAutoListenToggle() {
      persistAutoListenPref();
      if (!titleSelect.value) {
        disableAmbientMic();
        return;
      }
      if (autoListenEnabled()) {
        enableAmbientMic();
        setStatus(
          speechSupported()
            ? "Auto listen on — say “Hey…” + your question, or type below."
            : "Mic unavailable — type questions below.",
          "ok"
        );
      } else {
        disableAmbientMic();
        setStatus("Auto listen off — type questions to measure latency / quality.", "ok");
      }
    }

    async function loadTitles() {
      try {
        const response = await fetch("/titles");
        if (!response.ok) throw new Error("Could not load titles");
        const titles = await response.json();
        titleSelect.innerHTML = "";
        if (!titles.length) {
          titleSelect.disabled = true;
          titleSelect.innerHTML = '<option value="">No ingested titles yet</option>';
          setStatus("Ingest a title first, then refresh this page.", "error");
          return;
        }
        for (const title of titles) {
          const option = document.createElement("option");
          option.value = title.title_id;
          const label = title.display_name || title.title_id;
          option.textContent = `${label} (${title.scene_count} scenes)`;
          titleSelect.appendChild(option);
        }
        titleSelect.disabled = false;
        sendBtn.disabled = false;
        questionInput.disabled = false;
        onTitleChange();
      } catch (err) {
        titleSelect.innerHTML = '<option value="">Failed to load titles</option>';
        setStatus(err.message, "error");
      }
    }

    function onTitleChange() {
      const titleId = titleSelect.value;
      // Drop prior video decode buffers when switching titles.
      try {
        player.pause();
        player.removeAttribute("src");
        player.load();
      } catch (_) {}
      if (!titleId) {
        sendBtn.disabled = true;
        questionInput.disabled = true;
        disableAmbientMic();
        return;
      }
      player.preload = "metadata";
      player.src = `/video/${encodeURIComponent(titleId)}`;
      player.load();
      sendBtn.disabled = false;
      questionInput.disabled = false;
      if (autoListenEnabled()) {
        enableAmbientMic();
        setStatus(
          speechSupported()
            ? `Loaded ${titleId}. Play, then say “Hey…” + your question.`
            : `Loaded ${titleId}. Type questions below.`,
          "ok"
        );
      } else {
        disableAmbientMic();
        setStatus(
          `Loaded ${titleId}. Auto listen off — type a question (or enable Auto listen).`,
          "ok"
        );
      }
    }

    sendBtn.addEventListener("click", () => submitTypedQuestion());
    questionInput.addEventListener("keydown", (event) => {
      if (event.key === "Enter") { event.preventDefault(); submitTypedQuestion(); }
    });
    titleSelect.addEventListener("change", onTitleChange);
    if (autoListenMic) {
      autoListenMic.addEventListener("change", applyAutoListenToggle);
    }
    if (holdTalkBtn) {
      const endPtt = (event) => {
        if (event) event.preventDefault();
        stopPushToTalk();
      };
      const beginPtt = (event) => {
        if (event) event.preventDefault();
        startPushToTalk();
      };
      holdTalkBtn.addEventListener("pointerdown", beginPtt);
      holdTalkBtn.addEventListener("pointerup", endPtt);
      holdTalkBtn.addEventListener("pointerleave", endPtt);
      holdTalkBtn.addEventListener("pointercancel", endPtt);
      holdTalkBtn.addEventListener("keydown", (event) => {
        if (event.key === " " || event.key === "Enter") {
          event.preventDefault();
          startPushToTalk();
        }
      });
      holdTalkBtn.addEventListener("keyup", (event) => {
        if (event.key === " " || event.key === "Enter") {
          event.preventDefault();
          stopPushToTalk();
        }
      });
    }

    document.addEventListener("visibilitychange", () => {
      if (document.hidden) {
        disposeRecognition();
        cancelSynth();
        if (activeStreamAbort) {
          try { activeStreamAbort.abort(); } catch (_) {}
          activeStreamAbort = null;
        }
        // Keep AudioContext + mic MediaStream alive across tab hide (no restart on return).
        if (audioSession && audioSession.ctx && audioSession.ctx.state === "running") {
          try { audioSession.ctx.suspend(); } catch (_) {}
        }
        updateListenBadge("off", "Tab hidden");
      } else {
        if (audioSession && audioSession.ctx && audioSession.ctx.state === "suspended") {
          try { void audioSession.ctx.resume(); } catch (_) {}
        }
        if (shouldBeListening()) {
          scheduleListenRestart(LISTEN_COOLDOWN_MS);
        }
      }
    });

    window.addEventListener("pagehide", () => {
      disposeRecognition();
      cancelSynth();
      if (activeStreamAbort) {
        try { activeStreamAbort.abort(); } catch (_) {}
      }
      // Session end only — stop VAD loop; browser releases stream on navigation.
      if (audioSession) {
        if (audioSession.vadTimer) {
          clearInterval(audioSession.vadTimer);
          audioSession.vadTimer = null;
        }
      }
    });

    // Prefer metadata only; avoids aggressive full-file buffering where possible.
    player.preload = "metadata";

    loadTitles();
  </script>
</body>
</html>
