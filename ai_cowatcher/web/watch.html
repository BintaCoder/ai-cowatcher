<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Co-watcher</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #0f1115;
      --panel: #171a21;
      --border: #2a3140;
      --text: #e8ecf3;
      --muted: #9aa4b8;
      --accent: #5b8cff;
      --accent-pressed: #3f6fe0;
      --danger: #ff6b6b;
      --ok: #5bd18a;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
    }
    .layout {
      max-width: 1100px;
      margin: 0 auto;
      padding: 1.25rem;
      display: grid;
      gap: 1rem;
    }
    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
      flex-wrap: wrap;
    }
    h1 {
      margin: 0;
      font-size: 1.35rem;
      font-weight: 650;
    }
    .subtitle { color: var(--muted); font-size: 0.9rem; }
    .panel {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 1rem;
    }
    .controls {
      display: flex;
      gap: 0.75rem;
      align-items: center;
      flex-wrap: wrap;
    }
    label { color: var(--muted); font-size: 0.85rem; }
    select, button, input[type="text"] {
      font: inherit;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: #10141c;
      color: var(--text);
      padding: 0.55rem 0.85rem;
    }
    select { min-width: 220px; }
    #questionInput {
      flex: 1 1 220px;
      min-width: 180px;
    }
    button {
      cursor: pointer;
      transition: background 0.15s ease, transform 0.05s ease;
    }
    button:hover:not(:disabled) { background: #1a2130; }
    button:active:not(:disabled) { transform: translateY(1px); }
    button:disabled { opacity: 0.45; cursor: not-allowed; }
    #micBtn.listening {
      background: var(--accent);
      border-color: var(--accent);
      color: #fff;
    }
    #micBtn.listening:hover { background: var(--accent-pressed); }
    video {
      width: 100%;
      max-height: 62vh;
      background: #000;
      border-radius: 12px;
      display: block;
    }
    .status {
      min-height: 1.25rem;
      color: var(--muted);
      font-size: 0.92rem;
    }
    .status.thinking { color: var(--accent); }
    .status.error { color: var(--danger); }
    .status.ok { color: var(--ok); }
    .transcript {
      display: grid;
      gap: 0.75rem;
    }
    .bubble {
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 0.75rem 0.9rem;
      background: #12161f;
    }
    .bubble h3 {
      margin: 0 0 0.35rem;
      font-size: 0.78rem;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      color: var(--muted);
    }
    .bubble p {
      margin: 0;
      line-height: 1.45;
      white-space: pre-wrap;
    }
    .hint {
      color: var(--muted);
      font-size: 0.85rem;
      line-height: 1.4;
    }
    .toolbar {
      display: flex;
      gap: 0.5rem;
      flex-wrap: wrap;
      margin-top: 0.75rem;
      align-items: center;
    }
    .nav-toggle {
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      color: var(--muted);
      font-size: 0.9rem;
      user-select: none;
    }
    @media (max-width: 720px) {
      .layout { padding: 0.75rem; }
      select { min-width: 100%; }
    }
  </style>
</head>
<body>
  <div class="layout">
    <header>
      <div>
        <h1>Co-watcher</h1>
        <div class="subtitle">Watch, ask out loud, get a spoiler-safe answer</div>
      </div>
      <div class="controls">
        <label for="titleSelect">Title</label>
        <select id="titleSelect" disabled>
          <option value="">Loading titles…</option>
        </select>
      </div>
    </header>

    <section class="panel">
      <video id="player" controls playsinline preload="metadata"></video>
      <div class="toolbar">
        <button id="micBtn" type="button" disabled>Hold to ask (mic)</button>
        <button id="resumeBtn" type="button" disabled>Resume video</button>
        <label class="nav-toggle"><input id="navigationMode" type="checkbox" checked /> Navigate mode (jump to moments)</label>
      </div>
      <div class="toolbar">
        <input id="questionInput" type="text" placeholder="Or type a question / “go to 10:00”…" autocomplete="off" />
        <button id="sendBtn" type="button" disabled>Ask</button>
      </div>
      <p class="hint">Hold <strong>Space</strong> or the mic button to speak, or type below. Clock jumps (e.g. <strong>"go to 10 minutes"</strong>) seek immediately. Say <strong>"second fight"</strong>, <strong>"credits"</strong>, or <strong>"where does [actor] appear"</strong> to jump.</p>
      <div id="status" class="status">Pick a title to start.</div>
    </section>

    <section class="panel transcript">
      <div class="bubble">
        <h3>Your question</h3>
        <p id="questionText">—</p>
      </div>
      <div class="bubble">
        <h3>Co-watcher</h3>
        <p id="answerText">—</p>
      </div>
    </section>
  </div>

  <script>
    const player = document.getElementById("player");
    const titleSelect = document.getElementById("titleSelect");
    const micBtn = document.getElementById("micBtn");
    const resumeBtn = document.getElementById("resumeBtn");
    const sendBtn = document.getElementById("sendBtn");
    const questionInput = document.getElementById("questionInput");
    const navigationMode = document.getElementById("navigationMode");
    const statusEl = document.getElementById("status");
    const questionText = document.getElementById("questionText");
    const answerText = document.getElementById("answerText");

    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
    const synth = window.speechSynthesis;

    const USER_ID = "web-viewer";
    const NAV_INTENT_RE = /\b(go to|jump to|skip to|take me to|show me|find|where does|where is|when does)\b/i;
    const GO_TO_TIME_RE = /\b(?:go|jump|skip|take me)\s+to\s+(\d{1,2}:\d{2}(?::\d{2})?|\d+(?:\.\d+)?\s*(?:hours?|hrs?|h|minutes?|mins?|m))\b/i;
    const CLOCK_RE = /\b(\d{1,2}):(\d{2})(?::(\d{2}))?\b/;
    const DURATION_RE = /(\d+(?:\.\d+)?)\s*(hours?|hrs?|h|minutes?|mins?|m|seconds?|secs?|s)\b/gi;

    function isNavigationQuestion(question) {
      if (navigationMode && navigationMode.checked) {
        if (NAV_INTENT_RE.test(question)) return true;
        if (/\b(first|second|third|fourth|fifth|\d+(?:st|nd|rd|th))\s+(goal|fight|point|six|wicket|touchdown)\b/i.test(question)) return true;
        if (/\b(credits?|post[- ]credits?)\b/i.test(question)) return true;
        if (/\b\d{1,2}:\d{2}(?::\d{2})?\b/.test(question)) return true;
        if (/\b\d+(?:\.\d+)?\s*(?:minutes?|mins?|hours?|hrs?)\b/i.test(question)) return true;
        if (/\b(airplane|plane|crash)\b/i.test(question)) return true;
      }
      return NAV_INTENT_RE.test(question);
    }

    /** Client-side absolute seek (seconds), mirrors server time_parse for clock/duration. */
    function parseClientSeekTimestamp(question) {
      if (!question) return null;
      const goMatch = question.match(GO_TO_TIME_RE);
      if (goMatch) {
        const fragment = goMatch[1];
        if (fragment.includes(":")) {
          return parseClockFragment(fragment);
        }
        const duration = parseDurationSeconds(question);
        if (duration != null) return duration;
      }
      const clock = parseClockFragment(question);
      if (clock != null) return clock;
      return parseDurationSeconds(question);
    }

    function parseClockFragment(text) {
      const match = text.match(CLOCK_RE);
      if (!match) return null;
      let hours = 0;
      let minutes;
      let seconds;
      if (match[3] != null) {
        hours = parseInt(match[1], 10);
        minutes = parseInt(match[2], 10);
        seconds = parseInt(match[3], 10);
      } else if (parseInt(match[1], 10) > 59) {
        hours = parseInt(match[1], 10);
        minutes = parseInt(match[2], 10);
        seconds = 0;
      } else {
        minutes = parseInt(match[1], 10);
        seconds = parseInt(match[2], 10);
      }
      return hours * 3600 + minutes * 60 + seconds;
    }

    function parseDurationSeconds(text) {
      let total = 0;
      let found = false;
      DURATION_RE.lastIndex = 0;
      let match;
      while ((match = DURATION_RE.exec(text)) !== null) {
        found = true;
        const value = parseFloat(match[1]);
        const unit = match[2].toLowerCase();
        if (unit.startsWith("h")) total += value * 3600;
        else if (unit.startsWith("m")) total += value * 60;
        else total += value;
      }
      return found ? total : null;
    }

    function applySeek(seekToTs) {
      if (seekToTs == null || Number.isNaN(seekToTs)) return;
      player.currentTime = Math.max(0, seekToTs);
      player.play().catch(() => {});
      pausedForAsk = false;
      resumeBtn.disabled = true;
    }

    let recognition = null;
    let listening = false;
    let askInFlight = false;
    let pausedForAsk = false;
    let capturedTs = 0;
    let finalTranscript = "";
    let spaceHeld = false;
    let micHeld = false;
    let thinkingTimer = null;

    function setStatus(text, kind = "") {
      statusEl.textContent = text;
      statusEl.className = "status" + (kind ? " " + kind : "");
    }

    function startThinkingStatus(baseText) {
      const started = Date.now();
      setStatus(baseText, "thinking");
      if (thinkingTimer) clearInterval(thinkingTimer);
      thinkingTimer = setInterval(() => {
        const sec = ((Date.now() - started) / 1000).toFixed(1);
        setStatus(`${baseText} (${sec}s)`, "thinking");
      }, 200);
    }

    function stopThinkingStatus() {
      if (thinkingTimer) {
        clearInterval(thinkingTimer);
        thinkingTimer = null;
      }
    }

    function releaseControls(navigate) {
      askInFlight = false;
      micBtn.disabled = !titleSelect.value;
      sendBtn.disabled = !titleSelect.value;
      questionInput.disabled = !titleSelect.value;
      if (pausedForAsk && !navigate) {
        player.play().catch(() => {});
        pausedForAsk = false;
        resumeBtn.disabled = true;
      }
    }

    function speechSupported() {
      return Boolean(SpeechRecognition);
    }

    function ttsSupported() {
      return Boolean(synth);
    }

    function setupRecognition() {
      if (!SpeechRecognition) return null;
      const rec = new SpeechRecognition();
      rec.continuous = false;
      rec.interimResults = true;
      rec.lang = "en-US";
      rec.maxAlternatives = 1;

      rec.onstart = () => {
        listening = true;
        micBtn.classList.add("listening");
        setStatus("Listening… release when done speaking.", "ok");
      };

      rec.onresult = (event) => {
        let interim = "";
        for (let i = event.resultIndex; i < event.results.length; i += 1) {
          const result = event.results[i];
          const text = result[0].transcript.trim();
          if (!text) continue;
          if (result.isFinal) {
            finalTranscript = `${finalTranscript} ${text}`.trim();
          } else {
            interim = `${interim} ${text}`.trim();
          }
        }
        const preview = (finalTranscript || interim || "").trim();
        if (preview) questionText.textContent = preview;
      };

      rec.onerror = (event) => {
        if (event.error === "no-speech") {
          setStatus("Didn't catch speech — try again.", "error");
        } else if (event.error !== "aborted") {
          setStatus(`Speech error: ${event.error}`, "error");
        }
        cleanupListening();
      };

      rec.onend = async () => {
        listening = false;
        micBtn.classList.remove("listening");
        const question = finalTranscript.trim();
        finalTranscript = "";
        if (!question) {
          if (!askInFlight) {
            setStatus("No speech detected.", "error");
            maybeResumeAfterCancel();
          }
          return;
        }
        await submitQuestion(question);
      };

      return rec;
    }

    function cleanupListening() {
      listening = false;
      micBtn.classList.remove("listening");
    }

    function maybeResumeAfterCancel() {
      if (pausedForAsk) {
        player.play().catch(() => {});
        pausedForAsk = false;
        resumeBtn.disabled = true;
      }
    }

    function speakAnswer(text) {
      return new Promise((resolve) => {
        if (!text || !ttsSupported()) {
          resolve();
          return;
        }
        synth.cancel();
        const utterance = new SpeechSynthesisUtterance(text);
        utterance.rate = 1;
        utterance.onend = () => resolve();
        utterance.onerror = () => resolve();
        synth.speak(utterance);
      });
    }

    /** Speak without blocking mic unlock / resume; update status when done. */
    function speakAnswerInBackground(text, readyMessage) {
      if (!text || !ttsSupported()) {
        setStatus(readyMessage, "ok");
        return;
      }
      setStatus("Speaking answer… (you can ask again)", "ok");
      void speakAnswer(text).then(() => {
        if (!askInFlight && !listening) {
          setStatus(readyMessage, "ok");
        }
      });
    }

    async function submitQuestion(question) {
      const titleId = titleSelect.value;
      if (!titleId || askInFlight) return;

      let navigate = isNavigationQuestion(question);
      askInFlight = true;
      micBtn.disabled = true;
      sendBtn.disabled = true;
      questionInput.disabled = true;
      questionText.textContent = question;
      answerText.textContent = "…";

      // Absolute clock/duration: seek immediately so jump feels instant.
      const clientSeek = navigate ? parseClientSeekTimestamp(question) : null;
      if (clientSeek != null) {
        applySeek(clientSeek);
        answerText.textContent = `Jumping to ${_formatTs(clientSeek)}…`;
        startThinkingStatus(`Jumping to ${_formatTs(clientSeek)}`);
      } else {
        startThinkingStatus(navigate ? "Finding that moment…" : "Thinking…");
      }

      try {
        const endpoint = navigate ? "/navigate" : "/ask";
        const response = await fetch(endpoint, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            title_id: titleId,
            current_ts: capturedTs,
            question,
            user_id: USER_ID,
          }),
        });
        const data = await response.json();
        if (!response.ok) {
          throw new Error(data.detail || `${navigate ? "Navigate" : "Ask"} request failed`);
        }
        stopThinkingStatus();
        answerText.textContent = data.answer || "—";

        if (navigate && data.seek_to_ts != null) {
          // Prefer server seek if it differs (events/semantic); re-apply client clock seeks too for consistency.
          applySeek(data.seek_to_ts);
          releaseControls(true);
          setStatus(`Jumped to ${_formatTs(data.seek_to_ts)}`, "ok");
          speakAnswerInBackground(data.answer, "Ready — hold Space, mic, or type to ask again.");
          return;
        }

        if (navigate && clientSeek != null) {
          releaseControls(true);
          setStatus(`At ${_formatTs(clientSeek)}`, "ok");
          speakAnswerInBackground(data.answer, "Ready — hold Space, mic, or type to ask again.");
          return;
        }

        releaseControls(false);
        speakAnswerInBackground(
          data.answer,
          "Ready — hold Space, mic, or type to ask again."
        );
      } catch (err) {
        stopThinkingStatus();
        answerText.textContent = "—";
        setStatus(err.message || "Something went wrong.", "error");
        releaseControls(!!navigate || clientSeek != null);
      }
    }

    function submitTypedQuestion() {
      const question = (questionInput.value || "").trim();
      if (!question || askInFlight) return;
      capturedTs = player.currentTime || 0;
      if (!player.paused && !isNavigationQuestion(question)) {
        player.pause();
        pausedForAsk = true;
        resumeBtn.disabled = false;
      }
      questionInput.value = "";
      void submitQuestion(question);
    }

    function _formatTs(seconds) {
      const total = Math.floor(seconds);
      const hours = Math.floor(total / 3600);
      const minutes = Math.floor((total % 3600) / 60);
      const secs = total % 60;
      if (hours > 0) return `${hours}:${String(minutes).padStart(2, "0")}:${String(secs).padStart(2, "0")}`;
      return `${minutes}:${String(secs).padStart(2, "0")}`;
    }

    function beginAsk() {
      if (askInFlight || listening || !titleSelect.value) return;
      if (!speechSupported()) {
        setStatus("Voice not available in this browser — type a question below.", "error");
        questionInput.focus();
        return;
      }

      capturedTs = player.currentTime || 0;
      if (!player.paused) {
        player.pause();
        pausedForAsk = true;
        resumeBtn.disabled = false;
      } else {
        pausedForAsk = false;
      }

      finalTranscript = "";
      questionText.textContent = "…";
      answerText.textContent = "—";

      try {
        recognition.start();
      } catch (err) {
        setStatus("Could not start microphone — type a question below.", "error");
        maybeResumeAfterCancel();
      }
    }

    function endAsk() {
      if (!listening || !recognition) return;
      try {
        recognition.stop();
      } catch (_) {
        cleanupListening();
      }
    }

    async function loadTitles() {
      try {
        const response = await fetch("/titles");
        if (!response.ok) throw new Error("Could not load titles");
        const titles = await response.json();
        titleSelect.innerHTML = "";
        if (!titles.length) {
          titleSelect.disabled = true;
          titleSelect.innerHTML = '<option value="">No ingested titles yet</option>';
          setStatus("Ingest a title first, then refresh this page.", "error");
          return;
        }
        for (const title of titles) {
          const option = document.createElement("option");
          option.value = title.title_id;
          const label = title.display_name || title.title_id;
          option.textContent = `${label} (${title.scene_count} scenes)`;
          titleSelect.appendChild(option);
        }
        titleSelect.disabled = false;
        micBtn.disabled = !speechSupported();
        sendBtn.disabled = false;
        questionInput.disabled = false;
        if (!speechSupported()) {
          setStatus("Voice unavailable — type questions, or use Chrome for mic.", "ok");
        } else {
          setStatus("Ready — pick a title and press play.", "ok");
        }
        onTitleChange();
      } catch (err) {
        titleSelect.innerHTML = '<option value="">Failed to load titles</option>';
        setStatus(err.message, "error");
      }
    }

    function onTitleChange() {
      const titleId = titleSelect.value;
      if (!titleId) {
        player.removeAttribute("src");
        player.load();
        micBtn.disabled = true;
        sendBtn.disabled = true;
        questionInput.disabled = true;
        return;
      }
      player.src = `/video/${encodeURIComponent(titleId)}`;
      player.load();
      micBtn.disabled = !speechSupported();
      sendBtn.disabled = false;
      questionInput.disabled = false;
      setStatus(`Loaded ${titleId}. Play, then hold Space/mic or type to ask.`, "ok");
    }

    micBtn.addEventListener("mousedown", (event) => {
      event.preventDefault();
      micHeld = true;
      beginAsk();
    });
    micBtn.addEventListener("mouseup", () => {
      micHeld = false;
      endAsk();
    });
    micBtn.addEventListener("mouseleave", () => {
      if (micHeld) {
        micHeld = false;
        endAsk();
      }
    });
    micBtn.addEventListener("touchstart", (event) => {
      event.preventDefault();
      micHeld = true;
      beginAsk();
    }, { passive: false });
    micBtn.addEventListener("touchend", (event) => {
      event.preventDefault();
      micHeld = false;
      endAsk();
    });

    window.addEventListener("keydown", (event) => {
      if (event.code !== "Space" || event.repeat) return;
      const tag = (event.target && event.target.tagName) || "";
      if (tag === "INPUT" || tag === "TEXTAREA" || tag === "SELECT") return;
      event.preventDefault();
      if (!spaceHeld) {
        spaceHeld = true;
        beginAsk();
      }
    });

    window.addEventListener("keyup", (event) => {
      if (event.code !== "Space") return;
      event.preventDefault();
      spaceHeld = false;
      endAsk();
    });

    resumeBtn.addEventListener("click", () => {
      player.play().catch(() => {});
      pausedForAsk = false;
      resumeBtn.disabled = true;
      if (synth) synth.cancel();
      setStatus("Playback resumed.", "ok");
    });

    sendBtn.addEventListener("click", () => submitTypedQuestion());
    questionInput.addEventListener("keydown", (event) => {
      if (event.key === "Enter") {
        event.preventDefault();
        submitTypedQuestion();
      }
    });

    titleSelect.addEventListener("change", onTitleChange);

    recognition = setupRecognition();
    loadTitles();
  </script>
</body>
</html>
